name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      # One gate, shared with local development: `make check` runs gofmt,
      # golangci-lint, vet, build, unit tests and the docs staleness check.
      - name: Gate
        run: make check
        env:
          # Acceptance tests are explicitly disabled in CI per spec D4.
          TF_ACC: ""

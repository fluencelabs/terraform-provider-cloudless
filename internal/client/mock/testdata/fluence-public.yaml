components:
  schemas:
    AddDataDiskRequest:
      type: object
      description: Create-object variant of `POST /v3/vms/{id}/storages`.
      required:
      - volumeGb
      properties:
        name:
          type:
          - string
          - 'null'
        replicated:
          type: boolean
        volumeGb:
          type: integer
          format: u-int32
          minimum: 1
    AddDataDiskRequestBody:
      oneOf:
      - $ref: '#/components/schemas/UserStorageId'
      - $ref: '#/components/schemas/AddDataDiskRequest'
      description: Add an existing data disk by UUID or create a new draft data disk.
    AddPublicIpRequest:
      type: object
      required:
      - publicIpId
      properties:
        publicIpId:
          $ref: '#/components/schemas/UserPublicIpId'
    AddStoragesRequest:
      type: object
      required:
      - dataDisks
      properties:
        dataDisks:
          type: array
          items:
            $ref: '#/components/schemas/UserStorageId'
    AddVmInterfaceKind:
      oneOf:
      - type: object
        required:
        - private
        properties:
          private:
            type: object
            required:
            - subnet
            properties:
              subnet:
                $ref: '#/components/schemas/UserSubnetId'
      - type: object
        required:
        - public
        properties:
          public:
            type: object
            properties:
              addressType:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/NewIpAddressType'
                  description: Address type for a draft-created public IP (defaults
                    to IPv4).
              publicIp:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserPublicIpId'
                  description: 'Attach an existing public IP — required for a live
                    VM, and must be

                    absent for a draft VM (which creates its own draft public IP).'
      description: 'The interface to add via `POST /v3/vms/{id}/interfaces`. A public
        IP is

        modeled as an interface. Unlike the read DTO, the `Public` variant carries

        no IP id for a draft VM — adding a public interface to a draft *creates* a

        draft public IP; a live VM attaches an existing one.'
    AddVmInterfaceRequest:
      type: object
      description: Body of `POST /v3/vms/{id}/interfaces`.
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/AddVmInterfaceKind'
    AvailableStorageDto:
      type: object
      required:
      - storageType
      - replicated
      - volumeGb
      properties:
        replicated:
          type: boolean
        storageType:
          $ref: '#/components/schemas/StorageTypeDto'
        volumeGb:
          type: integer
          format: u-int64
          example: '100'
          minimum: 0
    BootMode:
      type: string
      enum:
      - BIOS
      - EFI
    BulkClusterResourcesDto:
      type: object
      required:
      - resources
      properties:
        resources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ClusterResourcesDto'
          propertyNames:
            type: string
            format: uuid
    ChargeGroupByDto:
      type: string
      description: 'Resource dimension to aggregate charges by. Defaults to the full

        `(user, resourceId, resourceType)` tuple when omitted.'
      enum:
      - RESOURCE
      - RESOURCE_TYPE
      - CLUSTER
    ChargePeriodDto:
      type: string
      description: 'Time bucket to split aggregated charges into. When omitted, charges
        are not

        split by time.'
      enum:
      - DAY
      - MONTH
    CloudInitDto:
      type: object
      properties:
        userData:
          type:
          - string
          - 'null'
          description: 'Raw cloud-init `userData`. Forwarded to lightmare verbatim;
            not

            retrievable after VM creation.'
    CloudInitInfoDto:
      type: object
      description: 'Presence-only marker. If `cloud_init` is non-null on a VM, the
        VM was

        created with cloud-init `userData`. The content itself is wiped after

        the VM transitions out of `New` and is not retrievable via API.'
    ClusterDto:
      type: object
      required:
      - id
      - name
      - dcId
      properties:
        dcId:
          type: string
          example: 92e6ed24-8bfa-4737-9409-a1aac994e1f5
        id:
          type: string
          example: 92e6ed24-8bfa-4737-9409-a1aac994e1f5
        name:
          type: string
          example: Cloudless
    ClusterId:
      type: string
      format: uuid
    ClusterResourcesDto:
      type: object
      required:
      - availablePublicIps
      - availableStorage
      - availableConfigurations
      properties:
        availableConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/VmConfigurationDto'
        availablePublicIps:
          type: object
          additionalProperties:
            type: integer
            format: u-int16
            minimum: 0
          propertyNames:
            type: string
            enum:
            - V4
            - V6
          example:
            V4: 10
            V6: 150
        availableStorage:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AvailableStorageDto'
          propertyNames:
            type: string
            enum:
            - AMD_ZEN2
            - AMD_ZEN3
            - AMD_ZEN5
          example:
            AMD_ZEN3:
            - replicated: true
              storageType: NVME
              volumeGb: 100
            - replicated: false
              storageType: NVME
              volumeGb: 200
    CollectionResponse_ClusterDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - id
            - name
            - dcId
            properties:
              dcId:
                type: string
                example: 92e6ed24-8bfa-4737-9409-a1aac994e1f5
              id:
                type: string
                example: 92e6ed24-8bfa-4737-9409-a1aac994e1f5
              name:
                type: string
                example: Cloudless
    CollectionResponse_DatacenterDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - id
            - countryCode
            - cityCode
            - cityName
            - index
            - tier
            - certifications
            - slug
            properties:
              certifications:
                type: array
                items:
                  type: string
              cityCode:
                type: string
              cityName:
                type: string
              countryCode:
                type: string
              id:
                $ref: '#/components/schemas/DatacenterId'
              index:
                type: integer
                format: int32
              slug:
                type: string
              tier:
                type: integer
                format: int32
    CollectionResponse_DefaultImageDto:
      type: object
      required:
      - items
      properties:
        items:

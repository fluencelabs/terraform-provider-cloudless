          items:
            $ref: '#/components/schemas/UserSubnetDto'
    UserVmId:
      type: string
      format: uuid
    UserVmNetworkInterfaceId:
      type: string
      format: uuid
    UserVmReference:
      type: object
      description: A VM reference (id + name) surfaced where a resource is attached,
        so callers avoid a second lookup.
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/UserVmId'
        name:
          type: string
    UserVmStatusDto:
      type: string
      enum:
      - draft
      - new
      - launching
      - launched
      - failed
      - updating
      - terminating
      - terminated
      - suspending
      - suspended
      - restarting
      - softRebooting
      - unknown
    UserVpcDto:
      type: object
      required:
      - id
      - userId
      - clusterId
      - name
      - status
      - subnetsCount
      - createdAt
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        createdAt:
          type: string
          format: date-time
        enableExternal:
          type:
          - boolean
          - 'null'
          description: Deprecated and inert; always reported as `null`.
          deprecated: true
        id:
          $ref: '#/components/schemas/UserVpcId'
        name:
          type: string
        readySince:
          type:
          - string
          - 'null'
          format: date-time
        removedAt:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/UserVpcStatusDto'
        subnetsCount:
          type: integer
          format: u-int32
          minimum: 0
        userId:
          $ref: '#/components/schemas/UserId'
    UserVpcId:
      type: string
      format: uuid
    UserVpcIdsDto:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/UserVpcId'
    UserVpcStatusDto:
      type: string
      enum:
      - new
      - created
      - ready
      - failed
      - removing
      - removed
      - dormant
      - parking
    UserWithScopesDto:
      type: object
      required:
      - id
      - email
      - permissions
      properties:
        email:
          type: string
          example: user@gmail.com
        id:
          type: string
          example: 9ba32273-49e6-4655-b193-b29f61752c2f
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
          uniqueItems: true
    VmActionDto:
      type: string
      description: 'Wire representation of [`VmAction`] — the operations exposed via

        `UserVmDto.allowedActions`.'
      enum:
      - addPublicIp
      - removePublicIp
      - addStorages
      - removeStorages
      - updateNetworkInterface
      - restart
      - softReboot
      - terminate
    VmBootDisk:
      oneOf:
      - $ref: '#/components/schemas/UserStorageId'
      - $ref: '#/components/schemas/CreateUserStorageRequest'
        description: Creates storage in the VM cluster; `clusterId` must match the
          VM request.
    VmConfigurationDto:
      type: object
      required:
      - id
      - slug
      - name
      - vcpu
      - ramGb
      - dedicated
      - cpuFamilies
      - preset
      - tags
      - description
      properties:
        cpuFamilies:
          type: array
          items:
            $ref: '#/components/schemas/CpuFamilyDto'
        dedicated:
          type: boolean
        description:
          type: string
        id:
          $ref: '#/components/schemas/VmConfigurationId'
        name:
          type: string
        preset:
          $ref: '#/components/schemas/VmConfigurationPreset'
        ramGb:
          type: integer
          format: u-int64
          example: '4'
          minimum: 0
        slug:
          $ref: '#/components/schemas/VmConfigurationSlug'
        tags:
          type: array
          items:
            type: string
        vcpu:
          type: integer
          format: u-int8
          example: '2'
          minimum: 0
    VmConfigurationId:
      type: string
      format: uuid
    VmConfigurationPreset:
      type: string
      enum:
      - general
      - cpu_optimized
      - memory_optimized
    VmConfigurationSlug:
      type: string
      enum:
      - cpu-regular-2vcpu-4gb
      - cpu-regular-4vcpu-8gb
      - cpu-regular-8vcpu-16gb
      - cpu-regular-8vcpu-32gb
      - cpu-regular-16vcpu-32gb
      - cpu-regular-24vcpu-48gb
      - cpu-regular-32vcpu-64gb
      - cpu-regular-64vcpu-128gb
      - cpu-premium-2vcpu-4gb
      - cpu-premium-4vcpu-8gb
      - cpu-premium-8vcpu-16gb
      - cpu-premium-8vcpu-32gb
      - cpu-premium-16vcpu-32gb
      - cpu-premium-24vcpu-48gb
      - cpu-premium-32vcpu-64gb
      - cpu-premium-64vcpu-128gb
      - cpu-shared-2vcpu-2gb
      - cpu-shared-3vcpu-4gb
      - cpu-shared-4vcpu-8gb
      - cpu-shared-8vcpu-16gb
      - cpu-shared-16vcpu-32gb
    VmDataDisk:
      oneOf:
      - $ref: '#/components/schemas/UserStorageId'
      - $ref: '#/components/schemas/CreateUserStorageRequest'
        description: Creates storage in the VM cluster; `clusterId` must match the
          VM request.
    VmExpand:
      type: string
      description: 'Attached resource a `?expand` member can inline on a VM response:
        the bare

        id stays in place and the resolved object is added to the `expanded` block.'
      enum:
      - bootDisk
      - dataDisks
      - publicIp
      - subnets
      - sshKeys
      - networkInterfaces
    VmNetworkInterfaceDto:
      type: object
      required:
      - id
      - default
      - kind
      - staticIps
      - assignedIps
      properties:
        assignedIps:
          type: array
          items:
            type: string
          description: Addresses observed on the live VM for this interface.
        default:
          type: boolean
        id:
          $ref: '#/components/schemas/UserVmNetworkInterfaceId'
        kind:
          $ref: '#/components/schemas/NetworkInterfaceKindDto'
        securityGroup:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserSecurityGroupId'
        staticIps:
          type: array
          items:
            type: string
          description: Requested static private IPs (private interfaces only).
    VmPriceInfoDto:
      type: object
      required:
      - vmTypeId
      - priceInfo
      properties:
        priceInfo:
          $ref: '#/components/schemas/PriceInfoDto'
        vmTypeId:
          $ref: '#/components/schemas/VmTypeIdDto'
    VmPublicIp:
      oneOf:
      - $ref: '#/components/schemas/UserPublicIpId'
      - $ref: '#/components/schemas/CreateUserPublicIpRequest'
        description: Creates an address in the VM cluster; `clusterId` must match
          the VM request.
    VmTypeIdDto:
      type: object
      required:
      - vmConfigurationId
      - clusterId
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        vmConfigurationId:
          $ref: '#/components/schemas/VmConfigurationId'
    VpcRemovalBlockerDto:
      type: object
      required:
      - vpcId
      - subnetCount
      - securityGroupCount
      properties:
        securityGroupCount:
          type: integer
          format: u-int64
          description: Security groups that must be removed before the VPC can be
            terminated.
          minimum: 0
        subnetCount:
          type: integer
          format: u-int64
          description: 'Live subnets blocking removal. Only the default VPC''s unused
            default

            subnet is exempt; a custom VPC''s default subnet is counted.'
          minimum: 0
        vpcId:
          $ref: '#/components/schemas/UserVpcId'
    VpcRemovalConflictBody:
      type: object
      required:
      - error
      - code
      - blockers
      properties:
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/VpcRemovalBlockerDto'
        code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
  responses:
    ErrorBody:
      description: ''
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - code
            properties:
              code:
                $ref: '#/components/schemas/ErrorCode'
                description: The stable, machine-readable error code.
              error:
                type: string
                description: The human-readable error message.
              violations:
                type: array
                items:
                  $ref: '#/components/schemas/DraftProvisionViolation'
                description: 'Structured, actionable facts for draft-provision admission
                  failures. The order is stable for a given set of facts, so a client
                  may render the list as it arrives. A client must ignore a violation
                  whose type it does not recognise: new types are added without a
                  breaking change.'
                uniqueItems: true
  securitySchemes:
    access_jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by Fluence
    api_key:
      type: apiKey
      in: header
      name: X-API-KEY
    s2s_api_key:
      type: apiKey
      in: header
      name: X-S2S-API-KEY
security:
- api_key: []
tags:
- name: SSH keys
  description: Endpoints to manage SSH keys
- name: VMs
  description: Endpoints to create, view, update and delete VMs
- name: Hardware
  description: Hardware API endpoints
- name: Prices
  description: Endpoints to get prices for different resources and cost estimation
- name: Subnets
  description: Endpoints to create, view, update and delete subnets
- name: VPCs
  description: Endpoints to create, view, update and delete VPCs
- name: Storage
  description: Endpoints to create, view, update and delete storage resources
- name: SecurityGroup
  description: Endpoints to create, view, update and delete security groups
- name: Users
  description: Users API endpoints
- name: Billing
  description: Billing and payment related endpoints

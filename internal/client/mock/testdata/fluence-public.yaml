        ids:
          type: array
          items:
            $ref: '#/components/schemas/UserStorageId'
    UserStorageStatus:
      type: string
      enum:
      - draft
      - new
      - created
      - ready
      - updating
      - failed
      - removing
      - removed
    UserStorageStatusDto:
      type: string
      enum:
      - draft
      - new
      - created
      - ready
      - updating
      - failed
      - removing
      - removed
    UserSubnetDto:
      type: object
      required:
      - id
      - userId
      - clusterId
      - vpcId
      - name
      - status
      - egress
      - isDefault
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        egress:
          type: boolean
          description: Whether the subnet has outbound internet access.
        id:
          $ref: '#/components/schemas/UserSubnetId'
        ipv4Cidr:
          type:
          - string
          - 'null'

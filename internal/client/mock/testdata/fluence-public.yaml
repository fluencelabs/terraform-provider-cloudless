      summary: '`POST /v3/vms/{id}/cluster` — move a draft to another cluster.'
      description: 'Its own method rather than a `PATCH` field: a move has refusals
        the field

        edits do not have, and each answers with its own wire code. Everything a

        draft holds is cluster-scoped, so the move carries the draft storages and
        the

        draft public IP along, detaches materialized disks, drops the network bindings

        the target cluster cannot serve (subnet, security group, static IPs), and
        may

        re-bind one private interface to a subnet in the target cluster. Other private

        interfaces remain unbound until the caller selects target-cluster subnets.


        Neither capacity nor pricing is checked here: a draft may wait arbitrarily

        long before provision, and both the capacity snapshot and the price registry

        age meanwhile, so provision stays the admission gate. What is refused is only

        what the move itself cannot carry.

        Same-target requests are idempotent no-ops and accept a stale `expectedUpdatedAt`.'

            type: string
          type:
            type: string
            enum:
            - redirect
      description: 'Typed presentation handed to the client in the v2 top-up response.
        Stored in

        the provider session as JSON (`ProviderSession.presentation`); adapters write

        the tagged form, readers (v2 mappers, v1 shim) accept it with a fallback to

        the legacy flat `redirect_url` key for in-flight pre-migration sessions.


        Tagged (`{ "type": "redirect", "redirectUrl": ... }`) so future variants

        (e.g. a direct crypto-transfer with `payAddress`) are additive, not a

        breaking field change.'
    TopUpRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
    TopUpSortFieldDto:
      type: string
      description: 'Field to order billing history by. `amount` sorts by the top-up
        amount;

        `createdAt` (the default) is newest-first. Distinct from `SortFieldDto`

        because the billing listings expose `amount` while the CRD listings do not.'
      enum:
      - createdAt
      - amount
    TopUpStatusDTO:
      type: string
      enum:
      - created
      - failed
      - canceled
      - expired
      - pending
      - completed
      - aml_failed
    TopUpV2Dto:
      type: object
      description: 'v2-native top-up read DTO. Amounts are integer cents (matching
        the create

        input and storage — no legacy 10^8 base units); status is the provider-neutral

        [`TopUpV2Status`]; the redirect URL is provider-neutral (the backend overloads

        the legacy `copperx_session_url` column for any provider).'
      required:
      - id
      - userId
      - amountCents
      - status
      - createdAt
      - updatedAt
      properties:
        amountCents:
          type: integer
          format: int64
        createdAt:
          type: string
          example: '2024-01-01T00:00:00Z'
        expiresAt:
          type:
          - string
          - 'null'
          description: 'When this top-up''s checkout session times out. `null` for
            legacy

            `public.top_ups` rows, which have no expiry.'

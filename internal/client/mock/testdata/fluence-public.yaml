    ConsoleAccessToken:
      type: object
      description: 'Wire-shape returned to Pult. Identical to the response of the
        previous

        vodopad mint endpoint, which proxied through crd-api

        for the opaque token; only the contents of `token` change here (opaque

        short string → RS256 JWT). Pult treats it as a bearer it forwards to

        vm-api and never parses it.'
      required:
      - token
      - vmApiDomain
      - workspaceId
      - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time
          description: 'Absolute expiration of the JWT, mirrored from the `exp` claim
            so the

            client can preemptively re-mint.'
        token:
          type: string
          description: 'RS256 JWT signed with the vodopad `JwtService` RSA key, audience

            `lightmare-vm-api`, issuer `vodopad`. Carries `{sub, vm_id,

            workspace_id, iat, exp, aud, iss}` — see

            [`crate::api::auth::types::VmAccessClaims`].'
        vmApiDomain:
          type: string
          description: 'Public base URL of lightmare vm-api for the cluster this VM
            lives

            on. Pult builds the attach URL from this + the JWT. Sourced from

            `clusters.vm_api_domain` (migration 1147); if

            the cluster row has NULL the handler answers 503.'
        workspaceId:
          type: string
          format: uuid
          description: 'Workspace the JWT is scoped to — mirrored from the `workspace_id`

            claim. vm-api compares this against the path segment on every

            request, so Pult must use exactly this value when building the

            `/ws/{ws_id}/...` URL. Today vodopad''s model collapses workspace

            onto user (`UserWorkspaceId::from(UserId)`), but Pult must treat

            this as opaque — surfacing it here keeps callers off the

            `workspace_id == user_id` assumption.'
    CostRequest:
      type: object
      required:
      - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/PricingResourceTypeDto'
        secs:
          type:
          - integer
          - 'null'
          format: u-int64
          minimum: 0
    CostResult:
      type: object
      required:
      - costOfResources
      - totalCostPerSec
      - periodSecs
      - totalCost
      properties:
        costOfResources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCostDto'
        periodSecs:
          type: integer
          format: u-int64
          minimum: 0
        totalCost:
          type: string
          example: '0.1'
        totalCostPerSec:
          type: string
          example: '0.01'
    CpuFamilyDto:
      type: string
      enum:
      - AMD_ZEN2
      - AMD_ZEN3
      - AMD_ZEN5
    CreateApiKeyRequest:
      type: object
      required:
      - scopes
      - expiresAt
      - name
      properties:
        expiresAt:
          type: string
          example: '2025-01-01T00:00:00.000Z'
        name:

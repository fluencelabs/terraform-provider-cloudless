          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
        replicated:
          type: boolean
        volumeGb:
          type: integer
          format: u-int32
          minimum: 1
      additionalProperties: false
    CreateDraftBootDiskRequest:
      type: object
      required:
      - volumeGb
      - source
      properties:

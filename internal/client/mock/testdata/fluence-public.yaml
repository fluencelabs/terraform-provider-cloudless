  /v3/vms:
    get:
      tags:
      - VMs
      description: Lists the caller's VMs using the v2 response schema and query semantics.
      operationId: get_users_vms_v3
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserVmId'
      - name: name
        in: query
        description: Case-insensitive ILIKE match on name; '%' and '_' in the value
          act as SQL wildcards (any-sequence / any-single-char), not literal characters.
        required: false
        schema:
          type: string
        example: my-vm
      - name: status
        in: query
        description: 'Keep only VMs whose status is in this set. Repeat the parameter
          using

          bracket notation (`status[0]=launched&status[1]=new`); a single

          `status=launched` is also accepted. An empty set applies no filtering.'
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserVmStatusDto'
      - name: excludeStatus
        in: query
        description: 'Drop VMs whose status is in this set (`excludeStatus[0]=terminated`).

          Combined with `status`, the result is the intersection. An empty set

          applies no filtering.'
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserVmStatusDto'
      - name: clusterId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ClusterId'
      - name: publicIpId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserPublicIpId'
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortFieldDto'
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderDto'
      - name: expand
        in: query
        description: 'Resolve attached resources inline. Repeat with bracket notation

          (`expand[0]=bootDisk&expand[1]=dataDisks`). Default response keeps bare
          IDs.'
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/VmExpand'
      - name: page
        in: query
        description: 'One-based page number. Both this value and the computed

          `(page - 1) * perPage` offset must be no greater than

          9,007,199,254,740,991.'
        required: false
        schema:
          type: integer
          format: u-int64
          maximum: 9007199254740991
          minimum: 0
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: u-int64
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserVmDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: default_topology_unusable
                error: 'the default network is not usable: the default VPC is unhealthy;
                  delete the default VPC and retry'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token:
        - vms:read
      - api_key:
        - vms:read
    post:
      tags:
      - VMs
      summary: '`POST /v3/vms` — create a VM as a draft from system defaults. Takes
        no body:

        it picks a default cluster, the smallest configuration, a default OS image

        (as a draft boot disk), the user''s SSH keys and an existing attachable subnet

        when the workspace has one, then lands the VM and its boot disk in `Draft`
        —

        no cluster resource, no billing — in one transaction. Without a subnet the

        draft''s single interface is unbound; provision remains the admission gate.
        The

        user refines the draft via mutations and turns it into a live VM with

        provision. (Per-user defaults are out of scope for now.)'

        name:
          type: string
        readySince:
          type:
          - string
          - 'null'
          format: date-time
        removedAt:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/UserSubnetStatusDto'
        userId:
          $ref: '#/components/schemas/UserId'
        vpcId:
          $ref: '#/components/schemas/UserVpcId'
    UserSubnetId:
      type: string
      format: uuid
    UserSubnetIdsDto:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/UserSubnetId'
    UserSubnetStatusDto:
      type: string
      enum:
      - new
      - created
      - ready
      - failed
      - removing
      - removed
      - dormant
      - parking
    UserVmDto:
      type: object
      required:
      - id
      - userId
      - clusterId
      - configurationId
      - name
      - status
      - restartRequired
      - allowedActions
      - dataDisks
      - subnets
      - sshKeys
      - networkInterfaces
      - createdAt
      - updatedAt
      properties:
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/VmActionDto'
          description: Operations currently legal for this VM's `status`, derived
            from the same source as request validation (an advertised action will
            not 406).
        bootDisk:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserStorageId'
        cloudInit:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CloudInitInfoDto'
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        configurationId:
          $ref: '#/components/schemas/VmConfigurationId'
        configurationName:
          type:
          - string
          - 'null'
          description: Plan name of the VM's configuration; set on list/create responses,
            omitted elsewhere.
        configurationSlug:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VmConfigurationSlug'
            description: Plan slug of the VM's configuration. See `configuration_name`.
        createdAt:
          type: string
          format: date-time
        dataDisks:
          type: array
          items:
            $ref: '#/components/schemas/UserStorageId'
        expanded:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserVmExpandedDto'
            description: Inlined attached resources, present only for fields named
              in `?expand=`.
        id:
          $ref: '#/components/schemas/UserVmId'
        lastPaidAt:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        networkInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/UserVmNetworkInterfaceId'
        paidUntil:
          type:
          - string
          - 'null'
          format: date-time
        priceHourlyUsd:
          type:
          - string
          - 'null'
          description: 'Request-time hourly price snapshot in USD, serialized as a
            string;

            absent when the catalog has no active price for this resource. A UI

            estimate, not the amount billed.'
          example: '0.05'
        priceMonthlyUsd:
          type:
          - string
          - 'null'
          description: 'Request-time monthly price snapshot in USD (`hourly × 730`),
            serialized

            as a string. See `price_hourly_usd`.'
          example: '36.50'
        publicIp:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPublicIpId'
        ramGb:
          type:
          - integer
          - 'null'
          format: u-int64
          description: RAM in GB (decimal) of the VM's configuration. See `configuration_name`.
          minimum: 0
        readySince:
          type:
          - string
          - 'null'
          format: date-time
        restartRequired:
          type: boolean
        sshKeys:
          type: array
          items:
            $ref: '#/components/schemas/UserSshKeyId'
        status:
          $ref: '#/components/schemas/UserVmStatusDto'
        subnets:
          type: array
          items:
            $ref: '#/components/schemas/UserSubnetId'
        terminatedAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          $ref: '#/components/schemas/UserId'
        vcpu:
          type:
          - integer
          - 'null'
          format: u-int8
          description: vCPU count of the VM's configuration. See `configuration_name`.
          minimum: 0
    UserVmExpandedDto:
      type: object
      description: 'Attached resources resolved inline. Each field is set only when
        the matching

        `?expand=` member was requested; absent fields stay as bare IDs on the VM.'
      properties:
        bootDisk:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserStorageDto'
        dataDisks:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserStorageDto'
        networkInterfaces:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VmNetworkInterfaceDto'
        publicIp:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPublicIpDto'
        sshKeys:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserSshKeyDto'
        subnets:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserSubnetDto'
    UserVmId:
      type: string
      format: uuid
    UserVmNetworkInterfaceId:
      type: string
      format: uuid
    UserVmReference:
      type: object
      description: A VM reference (id + name) surfaced where a resource is attached,
        so callers avoid a second lookup.
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/UserVmId'
        name:
          type: string
    UserVmStatusDto:
      type: string
      enum:
      - draft
      - new
      - launching
      - launched
      - failed
      - updating
      - terminating
      - terminated
      - suspending
      - suspended
      - restarting
      - softRebooting
      - unknown
    UserVpcDto:
      type: object
      required:
      - id
      - userId
      - clusterId
      - name
      - status
      - subnetsCount
      - createdAt
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        createdAt:
          type: string
          format: date-time
        enableExternal:
          type:
          - boolean
          - 'null'
          description: Deprecated and inert; always reported as `null`.
          deprecated: true
        id:
          $ref: '#/components/schemas/UserVpcId'
        name:
          type: string
        readySince:
          type:
          - string
          - 'null'
          format: date-time
        removedAt:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/UserVpcStatusDto'
        subnetsCount:
          type: integer
          format: u-int32
          minimum: 0
        userId:
          $ref: '#/components/schemas/UserId'
    UserVpcId:
      type: string
      format: uuid
    UserVpcIdsDto:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/UserVpcId'
    UserVpcStatusDto:
      type: string
      enum:
      - new
      - created
      - ready
      - failed
      - removing
      - removed
      - dormant
      - parking
    UserWithScopesDto:
      type: object
      required:
      - id
      - email
      - permissions
      properties:
        email:
          type: string
          example: user@gmail.com
        id:
          type: string
          example: 9ba32273-49e6-4655-b193-b29f61752c2f
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
          uniqueItems: true
    VmActionDto:
      type: string
      description: 'Wire representation of [`VmAction`] — the operations exposed via

        `UserVmDto.allowedActions`.'
      enum:
      - addPublicIp
      - removePublicIp
      - addStorages
      - removeStorages
      - updateNetworkInterface
      - restart
      - softReboot
      - terminate
    VmBootDisk:
      oneOf:
      - $ref: '#/components/schemas/UserStorageId'
      - $ref: '#/components/schemas/CreateUserStorageRequest'
        description: Creates storage in the VM cluster; `clusterId` must match the
          VM request.
    VmConfigurationDto:
      type: object
      required:
      - id
      - slug
      - name
      - vcpu
      - ramGb
      - dedicated
      - cpuFamilies
      - preset
      - tags
      - description
      properties:
        cpuFamilies:
          type: array
          items:
            $ref: '#/components/schemas/CpuFamilyDto'
        dedicated:
          type: boolean
        description:
          type: string
        id:
          $ref: '#/components/schemas/VmConfigurationId'
        name:
          type: string
        preset:
          $ref: '#/components/schemas/VmConfigurationPreset'
        ramGb:
          type: integer
          format: u-int64
          example: '4'
          minimum: 0
        slug:
          $ref: '#/components/schemas/VmConfigurationSlug'
        tags:
          type: array
          items:
            type: string
        vcpu:
          type: integer
          format: u-int8
          example: '2'
          minimum: 0
    VmConfigurationId:
      type: string
      format: uuid
    VmConfigurationPreset:
      type: string
      enum:
      - general
      - cpu_optimized
      - memory_optimized
    VmConfigurationSlug:
      type: string
      enum:
      - cpu-regular-2vcpu-4gb
      - cpu-regular-4vcpu-8gb
      - cpu-regular-8vcpu-16gb
      - cpu-regular-8vcpu-32gb
      - cpu-regular-16vcpu-32gb
      - cpu-regular-24vcpu-48gb
      - cpu-regular-32vcpu-64gb
      - cpu-regular-64vcpu-128gb
      - cpu-premium-2vcpu-4gb
      - cpu-premium-4vcpu-8gb
      - cpu-premium-8vcpu-16gb
      - cpu-premium-8vcpu-32gb
      - cpu-premium-16vcpu-32gb
      - cpu-premium-24vcpu-48gb
      - cpu-premium-32vcpu-64gb
      - cpu-premium-64vcpu-128gb
      - cpu-shared-2vcpu-2gb
      - cpu-shared-3vcpu-4gb
      - cpu-shared-4vcpu-8gb
      - cpu-shared-8vcpu-16gb
      - cpu-shared-16vcpu-32gb
    VmDataDisk:
      oneOf:
      - $ref: '#/components/schemas/UserStorageId'
      - $ref: '#/components/schemas/CreateUserStorageRequest'
        description: Creates storage in the VM cluster; `clusterId` must match the
          VM request.
    VmExpand:
      type: string
      description: 'Attached resource a `?expand` member can inline on a VM response:
        the bare

        id stays in place and the resolved object is added to the `expanded` block.'
      enum:
      - bootDisk
      - dataDisks
      - publicIp
      - subnets
      - sshKeys
      - networkInterfaces
    VmNetworkInterfaceDto:
      type: object
      required:
      - id
      - default
      - kind
      - staticIps
      - assignedIps
      properties:
        assignedIps:
          type: array
          items:
            type: string
          description: Addresses observed on the live VM for this interface.
        default:
          type: boolean
        id:
          $ref: '#/components/schemas/UserVmNetworkInterfaceId'
        kind:
          $ref: '#/components/schemas/NetworkInterfaceKindDto'
        securityGroup:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserSecurityGroupId'
        staticIps:
          type: array
          items:
            type: string
          description: Requested static private IPs (private interfaces only).
    VmPriceInfoDto:
      type: object
      required:
      - vmTypeId
      - priceInfo
      properties:
        priceInfo:
          $ref: '#/components/schemas/PriceInfoDto'
        vmTypeId:
          $ref: '#/components/schemas/VmTypeIdDto'
    VmPublicIp:
      oneOf:
      - $ref: '#/components/schemas/UserPublicIpId'
      - $ref: '#/components/schemas/CreateUserPublicIpRequest'
        description: Creates an address in the VM cluster; `clusterId` must match
          the VM request.
    VmTypeIdDto:
      type: object
      required:
      - vmConfigurationId
      - clusterId
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        vmConfigurationId:
          $ref: '#/components/schemas/VmConfigurationId'
    VpcRemovalBlockerDto:
      type: object
      required:
      - vpcId
      - subnetCount
      - securityGroupCount
      properties:
        securityGroupCount:
          type: integer
          format: u-int64
          description: Security groups that must be removed before the VPC can be
            terminated.
          minimum: 0
        subnetCount:
          type: integer
          format: u-int64
          description: 'Live subnets blocking removal. Only the default VPC''s unused
            default

            subnet is exempt; a custom VPC''s default subnet is counted.'
          minimum: 0
        vpcId:
          $ref: '#/components/schemas/UserVpcId'
    VpcRemovalConflictBody:
      type: object
      required:
      - error
      - code
      - blockers
      properties:
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/VpcRemovalBlockerDto'
        code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
  responses:
    ErrorBody:
      description: ''
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - code
            properties:
              code:
                $ref: '#/components/schemas/ErrorCode'
                description: The stable, machine-readable error code.
              error:
                type: string
                description: The human-readable error message.
              violations:
                type: array
                items:
                  $ref: '#/components/schemas/DraftProvisionViolation'
                description: 'Structured, actionable facts for draft-provision admission
                  failures. The order is stable for a given set of facts, so a client
                  may render the list as it arrives. A client must ignore a violation
                  whose type it does not recognise: new types are added without a
                  breaking change.'
                uniqueItems: true
  securitySchemes:
    access_jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by Fluence
    api_key:
      type: apiKey
      in: header
      name: X-API-KEY
    s2s_api_key:
      type: apiKey
      in: header
      name: X-S2S-API-KEY
security:
- api_key: []

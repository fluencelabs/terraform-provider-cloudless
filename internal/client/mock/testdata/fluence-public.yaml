  version: 0.14.0
paths:
  /api_keys:
    get:
      tags:
      - API keys
      operationId: List API keys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyInfoDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: default_topology_unusable
                error: 'the default network is not usable: the default VPC is unhealthy;
                  delete the default VPC and retry'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      deprecated: true
      security:
      - access_jwt_token: []
      - api_key:
        - api_key:list
    post:
      tags:
      - API keys
      operationId: Create API key
      requestBody:
        description: Create API key
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApiKeyDto'
        required: true
      responses:
        '200':
          description: API Key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDto'
              example:
                apiKey: 1234-5678-8901-2345
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: default_topology_unusable
                error: 'the default network is not usable: the default VPC is unhealthy;
                  delete the default VPC and retry'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      deprecated: true
      security:
      - access_jwt_token: []
      - api_key:
        - api_key:create
    delete:
      tags:
      - API keys
      operationId: Remove API key
      requestBody:
        description: Remove API Key by API Key or by hash
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteApiKeyDto'
        required: true
      responses:
        '200':
          description: API Key removed
          content:
            application/json: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: API key does not exist, belongs to another user, or was already
            removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: default_topology_unusable
                error: 'the default network is not usable: the default VPC is unhealthy;
                  delete the default VPC and retry'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      deprecated: true
      security:
      - access_jwt_token: []
      - api_key:
        - api_key:remove
  /auth/refresh:
    post:
      tags:

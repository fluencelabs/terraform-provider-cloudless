                  configurationId: 00000000-0000-4000-8000-000000000001
                  dataDisks:
                  - kind: new
                    volumeGb: 10
                  interfaces:
                  - addressType: V4
                    default: true
                    kind: public
                  name: demo
                  sshKeyIds:
                  - 00000000-0000-4000-8000-000000000001

        the provider session as JSON (`ProviderSession.presentation`); adapters write

        the tagged form, readers (v2 mappers, v1 shim) accept it with a fallback to

        the legacy flat `redirect_url` key for in-flight pre-migration sessions.


        Tagged (`{ "type": "redirect", "redirectUrl": ... }`) so future variants

        (e.g. a direct crypto-transfer with `payAddress`) are additive, not a

        breaking field change.'

        properties:
          found:
            type: integer
            minimum: 0
          type:
            type: string
            enum:
            - multiplePublicInterfaces
      - type: object
        required:
        - max
        - type
        properties:
          max:
            type: integer
            minimum: 0
          type:
            type: string
            enum:
            - tooManyInterfaces
      - type: object
        required:
        - kind
        - id
        - reason
        - type
        properties:
          id:
            type:
            - string
            - 'null'
            format: uuid
            description: 'The row the client must point at: the resource named by
              `kind`, or —

              for a kind that has no row of its own — the interface carrying the

              offending value. `null` when the violation is about the whole set.


              Required although it is nullable, and serialized even when absent, so

              the generated client types it `string | null` rather than

              `string | null | undefined`.'
          kind:
            $ref: '#/components/schemas/DraftDependencyKind'
          reason:
            $ref: '#/components/schemas/DraftDependencyReason'
          type:
            type: string
            enum:
            - dependency
      - type: object
        required:
        - type
        properties:

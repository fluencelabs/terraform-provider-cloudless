      type: string
      description: 'Lifecycle status exposed by the v2 top-up read DTO. It is `IntentStatus`

        plus `Failed`: terminal legacy (copperx) failures have no `IntentStatus`

        image, and collapsing them into `Canceled`/`Expired` would misreport a

        failure as a clean end state.'
      enum:

          format: u-int32
          minimum: 25
      additionalProperties: false
    CreatePublicApiKeyRequest:
      type: object
      required:
      - scopes
      - expiresAt
      - name
      properties:
        expiresAt:
          type: string
          format: date-time
        name:
          type: string
          maxLength: 25
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
        scopes:
          type: array
          items:
            type: string
          uniqueItems: true
      additionalProperties: false
    CreatePublicIpRequest:
      type: object
      required:

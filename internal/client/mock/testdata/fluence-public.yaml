openapi: 3.1.0
info:
  title: Fluence API
  description: "# Introduction\n\nThe Fluence API gives programmatic access to the\
    \ decentralized Fluence compute marketplace, letting you find, rent, and\nmanage\
    \ compute resources without the web UI. Integrate Fluence directly into your applications\
    \ and automated workflows.\n\nProduction base URL: `https://api.fluence.dev`.\
    \ Interactive requests use the environment serving this reference; do not paste\
    \ production credentials into another environment.\n\n**Start new integrations\
    \ with Public v3.** Public v1/v2 remain available for existing integrations. Console,\
    \ Admin and Internal are separate API surfaces, not additional versions of this\
    \ Public API.\n\n## Public v3 quick start\n\n1. Authorize with a scoped API key\
    \ or bearer token. Each operation lists its required permissions.\n2. Discover\
    \ clusters, configurations and images. The configuration catalog includes unpriced/unavailable\
    \ entries; use cluster resources to check availability.\n3. `POST /v3/vms` creates\
    \ a **Draft**, not a running VM. Supply a unique `Idempotency-Key` for the logical\
    \ create. An absent body or `{}` uses platform defaults; `null` is invalid.\n\
    4. Inspect and edit the draft: boot/data disks, network interfaces, SSH keys and\
    \ cloud-init. Example UUIDs are illustrative: replace them with owned resources\
    \ or catalog IDs.\n5. `GET /v3/vms/{vm_id}/estimate` estimates the saved draft.\
    \ `POST /v3/vm-estimates` estimates a complete specification without creating\
    \ it. `hourlyTotal` includes all selected resources; `hourlyIncremental` excludes\
    \ existing resources already billed separately. Both are decimal USD strings per\
    \ hour, not integer cents.\n6. `POST /v3/vms/{vm_id}/provision` checks admission\
    \ again and starts provisioning. Poll the VM to observe asynchronous completion.\
    \ An estimate does not reserve capacity or funds.\n7. `POST /v3/vms/{vm_id}/terminate`\
    \ accepts termination and returns retained resource IDs. Disks and public IPs\
    \ are **not deleted**: remove them separately when no longer needed to avoid ongoing\
    \ charges. `DELETE /v3/vms/{vm_id}` instead discards a Draft.\n\n### Retries and\
    \ optional values\n\nVM create and terminate use historical replay receipts. Repeat\
    \ the same request with the same `Idempotency-Key` after a lost response; do not\
    \ generate another key for that retry. Keys are 1–128 ASCII letters, digits or\
    \ `._:-`. Changed input conflicts with the original request (409); replay of a\
    \ create whose accepted VM was deleted returns 410. Replayed VM receipts describe\
    \ the accepted command, not current resource state. A busy request can return\
    \ 409 with `Retry-After`.\n\nProvision, edits and VM restart operations without\
    \ an `Idempotency-Key` remain state-based: after an uncertain result, inspect\
    \ resource state before retrying. Consult each operation's schema before using\
    \ a retry key.\n\nOmitted optional fields, `null` and empty values are not interchangeable.\
    \ In draft creation, omitted `interfaces` selects an automatic interface while\
    \ `[]` selects none. In interface PATCH, omitted `securityGroupId` leaves it unchanged\
    \ and `null` clears it. Empty PATCH objects are rejected. Consult each operation's\
    \ schema.\n\n### Public v3 errors and limits\n\nUse the operation's error schema:\
    \ common errors and specialized VM errors retain distinct envelopes and code vocabularies.\
    \ Validation errors can include `violations` with `field` and `reason`; specialized\
    \ VM violations are tagged. Empty PATCH uses `$` / `empty_patch`.\n\nMalformed\
    \ JSON returns 400; JSON exceeding the body limit returns 413. Common 413 errors\
    \ use `code: bad_request` and `$` / `payload_too_large`; specialized VM errors\
    \ use `code: payload_too_large`. Rate limiting returns 429 with `Retry-After`.\
    \ Do not retry a state-changing request under a new idempotency key simply because\
    \ a dependency returned 503.\n\nPaged v3 collections default to page 1 and 50\
    \ records; `perPage` is 1–200. Collections such as API keys are not necessarily\
    \ paginated. Prices support `ETag` / `If-None-Match` and an empty 304 response.\n\
    \n### Public v3 cloud-init\n\nDraft creation accepts `cloudInit` as a string,\
    \ not the v2 `cloudInit.userData` object. The draft's cloud-init can also be set\
    \ or cleared through its cloud-init endpoint. Nonempty UTF-8 data is limited to\
    \ 16 KiB **in bytes**, and is never returned by VM reads. Content is not parsed\
    \ as YAML by this API; the VM backend can reject it asynchronously. Do not put\
    \ long-lived secrets in examples or user data.\n\nThe documentation starts with\
    \ a high-level overview of design and technology, followed by endpoint reference\
    \ details.\nFor additional user guides, see the [Fluence Documentation](https://fluence.dev/docs/build/overview).\n\
    \n## Requests\n\nSend HTTPS requests to the Fluence API. Request bodies are JSON\
    \ where documented. Responses may be JSON, CSV, or empty, as specified by the\
    \ operation.\n\n- Set `Content-Type: application/json` for POST, PUT, and PATCH\
    \ calls.\n- All examples assume the default `Accept: application/json` header.\n\
    \n### Example\n\n```bash\ncurl -X POST https://api.fluence.dev/v1/public_ips \\\
    \n  -H \"Content-Type: application/json\" \\\n  -H \"X-API-KEY: <YOUR_API_KEY>\"\
    \ \\\n  -d '{\n        \"addressType\": \"V4\",\n        \"clusterId\": \"3fa85f64-5717-4562-b3fc-2c963f66afa6\"\
    ,\n        \"name\": \"my-public-ip\"\n      }'\n```\n\n### HTTP request methods\n\
    \nThe interface responds to different methods depending on the action required.\n\
    \n| Method | Description                                                     \
    \                                   |\n|--------|----------------------------------------------------------------------------------------------------|\n\
    | GET    | Retrieves resource information. These requests are read-only and won't\
    \ modify any resources.       |\n| POST   | Usually used to create new resources.\
    \ Include all required attributes in the request body as JSON. |\n| PATCH  | Update\
    \ specific attributes of a resource.                                         \
    \                 |\n| PUT    | Updates an entire resource by replacing it with\
    \ the provided data, regardless of current values.   |\n| DELETE | Removes resources.\
    \                                                                            \
    \     |\n\n## Responses\n\nSuccessful requests return `2xx` status codes. Some\
    \ return no body (204); charge exports can return CSV. Conditional reads can return\
    \ 304 without a body.\n\nIf an error occurs, Fluence returns an `4xx` or `5xx`\
    \ status code and a JSON object describing the problem.\n\n### Response codes\n\
    \n| Code | Description                                                       \
    \             |\n|------|--------------------------------------------------------------------------------|\n\
    | 2xx  | **Success** - The request was successfully received, understood, and\
    \ processed |\n| 4xx  | **Client Error** - The request contains invalid syntax\
    \ or cannot be fulfilled  |\n| 400  | Bad request - Invalid parameters or malformed\
    \ JSON                             |\n| 401  | Unauthorized - API key missing\
    \ or invalid                                      |\n| 403  | Forbidden - Authenticated\
    \ but not allowed                                      |\n| 404  | Not found -\
    \ Resource does not exist                                            |\n| 422\
    \  | Unprocessable Entity - Well-formed request but cannot be processed      \
    \       |\n| 500  | Internal server error - Unexpected error on our side.    \
    \                      |\n\n### Error Response Format\n\nError bodies are operation-specific.\
    \ Common authentication errors use an `error` field; Public v3 validation errors\
    \ use their documented code and violations. Read the corresponding response schema\
    \ rather than assuming one envelope for every endpoint.\n\n## Authentication\n\
    \nProtected operations require a JWT supplied as a Bearer token in `Authorization`\
    \ or an API key in `X-API-KEY`, according to their declared security schemes.\
    \ Service status and promo preview are examples of anonymous operations. Required\
    \ permissions are listed per operation. For example:\n\n```bash\ncurl -H 'Authorization:\
    \ Bearer my_authentication_token'\n```\n\n```bash\ncurl -H 'X-API-KEY: my_api_key'\n\
    ```\n\n### Managing API Keys\n\nCreate and manage keys in\nthe [Fluence Console\
    \ › Settings › API Keys](https://console.fluence.network/settings/api-keys).\n\
    \n- **Read-only keys** – retrieve information only\n- **Full-access keys** – manage\
    \ all resources\n\n> **Important**: API keys are only displayed once during creation\
    \ for security reasons. Store them safely - if a key is\n> lost, expired or compromised,\
    \ you'll need to delete it and create a new one.\n\n### Key Security\n\nAPI keys\
    \ function as complete authentication credentials, similar to a username/password\
    \ combination. Therefore:\n\n- Keep your keys secure and never share them\n- Use\
    \ HTTPS for all API requests\n- Rotate keys periodically\n- Set appropriate expiration\
    \ dates when creating keys\n- Delete compromised keys immediately\n\n## Legacy\
    \ v2 cloud-init\n\nOptional `cloudInit.userData` on `POST /v2/vms` lets you bootstrap\
    \ the VM with a\n[cloud-init](https://cloudinit.readthedocs.io/) configuration.\
    \ The payload is\nforwarded to the VM backend verbatim; vodopad does not parse\
    \ or validate the\ncontent beyond a 16 KiB byte cap.\n\n```bash\ncurl -X POST\
    \ https://api.fluence.dev/v2/vms \\\n  -H \"X-API-KEY: <YOUR_API_KEY>\" \\\n \
    \ -H \"Content-Type: application/json\" \\\n  -d '{\n        \"clusterId\": \"\
    ...\",\n        \"name\": \"demo\",\n        \"configurationId\": \"...\",\n \
    \       \"bootDisk\": { \"...\": \"...\" },\n        \"sshKeys\": [\"...\"],\n\
    \        \"cloudInit\": {\n          \"userData\": \"#cloud-config\\nruncmd:\\\
    n  - echo hello\\n\"\n        }\n      }'\n```\n\nNotes:\n\n- **Create-only.**\
    \ `userData` is meaningful only on `POST /v2/vms`. `PATCH` requests have no `userData`\
    \ field; sending one is dropped during JSON deserialization.\n- **Ephemeral.**\
    \ The content is stored only until the VM transitions to `Launched` (or `Failed`\
    \ on create-deadline, or `Terminating`/`Terminated` on termination), then erased\
    \ in the same transaction as the status change. After that, listing or fetching\
    \ the VM returns a non-null `cloudInit` object (no fields) as a permanent marker\
    \ but never the original content.\n- **Length limit.** Maximum 16 KiB enforced\
    \ as a **byte count** (UTF-8 multi-byte characters are counted by their byte size,\
    \ not code-point count). Oversize requests are rejected with `400 Bad Request`.\n\
    - **Privacy.** The content is never echoed back through any API endpoint. Avoid\
    \ logging database bind values or capturing request bodies in external middleware.\n\
    - **Backend rejection.** Malformed userData (e.g. invalid YAML) is detected by\
    \ the VM backend during provisioning and surfaces as a `Failed` VM status, not\
    \ a synchronous `400`.\n\n### Operator notes\n\n- The side-table `crd.user_virtual_machine_cloud_init`\
    \ keeps a row per VM that ever had cloud-init. After successful handoff to the\
    \ VM backend (status `Launching` or `Launched`) — or upon terminal cleanup (`Failed`\
    \ from create-deadline timeout, or `Terminating`/`Terminated` from termination)\
    \ — the row's `user_data` column is set to `NULL` in the same transaction as the\
    \ status change. The row itself stays as a permanent \"had cloud-init\" marker\
    \ — its existence is the source of truth for the non-null `cloudInit` object on\
    \ the response.\n- WAL/audit logs and `pg_dump` backups can preserve the **pre-wipe**\
    \ state (raw `user_data` bytes) until they roll over. Treat these artefacts as\
    \ carrying potentially-sensitive material; restrict access and retention accordingly.\n\
    - The HTTP logger records request/response metadata, not bodies; header values\
    \ are redacted. Preserve this boundary when adding middleware.\n- Do not set `RUST_LOG=sqlx=debug`\
    \ in production — sqlx debug logs can include bind values, which would expose\
    \ `userData` for in-flight queries.\n\n## Public v3 recovery after an uncertain\
    \ result\n\nAn accepted command, the latest resource state and completion in the\
    \ compute backend are different observations. A timeout, lost response or client\
    \ restart does not roll back a request. A later `4xx` response does not prove\
    \ that the first attempt failed: the first attempt may have changed the state\
    \ against which the retry is validated.\n\nBefore sending a command, durably save\
    \ its environment, account, target IDs and recovery metadata. For receipt-backed\
    \ commands, save the request key and original input securely. Save returned resource\
    \ IDs and receipts as soon as they arrive, so recovery can resume after a client\
    \ restart. Poll using the same account and environment; do not replace an uncertain\
    \ create with another create merely because the first ID was lost.\n\n### VM create\
    \ and terminate receipts\n\nThe VM receipt contract applies to `POST /v3/vms`\
    \ and `POST /v3/vms/{vm_id}/terminate`. Reuse the original `Idempotency-Key` and\
    \ input after an uncertain result. Changing the key starts a different logical\
    \ command. Receipt replay is not an API-wide property of POST, and sending this\
    \ header to another operation does not by itself make that operation replayable.\
    \ Consult that operation's contract before retrying.\n\n- VM create returns the\
    \ originally accepted draft and resource IDs, even after subsequent edits or provisioning.\
    \ Different input under the same key conflicts; if the accepted VM was deleted,\
    \ create replay returns `410 Gone`.\n- VM terminate returns the original retained\
    \ storage/IP inventory. Preserve it: a new terminate key cannot reconstruct the\
    \ old inventory after links have been removed. The receipt remains historical;\
    \ it does not mean those resources still exist or remain attached.\n- Provision,\
    \ restart, soft reboot and edits do not use these receipts. Inspect the saved\
    \ resource ID before deciding what to do next. The latest VM state cannot prove\
    \ whether one particular reboot request ran; blindly repeating it can request\
    \ another reboot.\n\nFor known resources, use their read endpoints to reconcile\
    \ the desired state. For example, a repeated resize can be refused after the first\
    \ resize was accepted; the desired size in GET is not proof of completed physical\
    \ resizing. A resource list can help locate an uncertain create, but names and\
    \ timestamps alone are not general request identities. If correlation is ambiguous,\
    \ retain the unresolved attempt and investigate before creating or deleting resources.\n\
    \n### Observing asynchronous resources\n\nPoll the relevant resource GET endpoint\
    \ using saved IDs. Treat the response as the latest state recorded by vodopad,\
    \ not a live guest probe or a durable history of every command. Apply a client\
    \ waiting budget and backoff, honoring `Retry-After` where supplied. Exhausting\
    \ that budget means the client stopped waiting; it does not cancel the command,\
    \ establish server failure, or authorize destructive recovery. The API does not\
    \ promise that every intermediate state reaches success or failure within a bounded\
    \ time.\n\nThe table below highlights selected states; it is not an exhaustive\
    \ status list.\n\n| Observation | Meaning and next action |\n| --- | --- |\n|\
    \ VM `draft` | Not provisioned. Inspect/edit/estimate, then provision when ready.\
    \ |\n| VM `new`, `launching`, `updating`, `restarting`, `softRebooting` | Work\
    \ is asynchronous. Continue observation; an accepted request is not completed\
    \ provisioning or reboot. |\n| VM `launched` | Backend readiness/running was observed.\
    \ It does not certify guest health, SSH reachability, application readiness or\
    \ completed cloud-init. |\n| VM `unknown` | Readiness/running did not match the\
    \ expected launched state. It can return to `launched`; it is not proof of terminal\
    \ failure or deletion. A transport error during observation can instead leave\
    \ the previous state unchanged. |\n| VM `failed` | Read `failure.code` and `failure.message`\
    \ when present. Reconcile retained resources before deciding on a replacement;\
    \ do not treat all failures as instructions to repeat create. |\n| VM `terminating`\
    \ | Termination is in progress. Keep observing; the terminate receipt holds the\
    \ retained storage and public IP IDs. |\n| Storage `created` or `updating` | Backend\
    \ creation/readiness or an update is pending. These states alone do not establish\
    \ whether the disk was ready before, whether data is intact, or whether charges\
    \ have stopped. |\n| Storage `ready` | The backend storage readiness flag was\
    \ observed. There is no separate guarantee here of completed image import, guest\
    \ initialization or successful boot, nor continuous observation of a ready disk.\
    \ |\n| Storage or network `failed` | There is no universal retry/recovery contract.\
    \ For subnet/security-group failures, also inspect the parent VPC. A PATCH is\
    \ not a promised recovery operation; avoid deleting a previously used disk merely\
    \ to retry. |\n| Public IP | Read `status` together with `failureReason` when\
    \ present. Cleanup after a failure can pass through `removing` and end in `failed`;\
    \ do not assume every `removing` IP will become `removed`. A failure reason does\
    \ not promise success of an identical new request. |\n| VPC/subnet `dormant` |\
    \ The logical topology is retained and can be woken by supported use. For example,\
    \ creating a subnet under a dormant VPC wakes the parent. Do not blindly recreate\
    \ the topology. |\n| VPC/subnet `parking` | Cluster materialization is being parked\
    \ toward dormancy, not user-requested removal. Conflicting operations may be rejected;\
    \ reread before proceeding. |\n\nTermination does not delete retained storage\
    \ or public IPs. Track and inspect those IDs separately; retained resources can\
    \ continue to incur charges. Remove only resources you intend to discard, after\
    \ resolving attachment/dependency conflicts. Do not infer that an empty visible\
    \ attachment list permits deletion: server-side checks can include links hidden\
    \ from the caller.\n\n`terminated`, `removed` and a subsequent resource `404`\
    \ describe the local API lifecycle/visibility. They do not certify that backend\
    \ objects are absent, Kubernetes finalizers have completed, or data has been physically\
    \ destroyed. In particular, VPC removal can finish locally after its backend-removal\
    \ retry deadline. Keep physical-erasure requirements separate from API cleanup\
    \ confirmation.\n\n### Recovering a lost API-key creation response\n\n`POST /v3/api-keys`\
    \ returns the credential value only on creation. Listing keys does not return\
    \ it. This operation has no VM receipt replay: repeated POSTs can issue different\
    \ credentials, including when they use the same name and `Idempotency-Key`. Names\
    \ are not unique on the server.\n\nKeep recovery access separate from the credential\
    \ being issued:\n\n| Action | Required permissions |\n| --- | --- |\n| List metadata\
    \ with `GET /v3/api-keys` | `api_key:list` |\n| Revoke a known key with `DELETE\
    \ /v3/api-keys/{api_key_id}` | `api_key:remove` |\n| Issue a replacement with\
    \ `POST /v3/api-keys` | `api_key:create` plus every requested scope in the caller's\
    \ effective permissions; admin scopes cannot be delegated |\n\nA credential with\
    \ only create permission cannot list or revoke the lost key. A credential with\
    \ list/remove permissions cannot necessarily issue its replacement. If recovery\
    \ access is also lost, sign in again as the account owner. Do not grant management\
    \ permissions to the new working key merely to make it recoverable.\n\n1. Before\
    \ the single POST, durably journal the environment, account, a fresh valid attempt\
    \ name, requested scopes, `expiresAt` and a pending state. Use a different name\
    \ for each attempt and one sender per attempt. The client must prevent name reuse\
    \ across its concurrent issuers; the server does not enforce this. Keep secrets\
    \ out of this journal and logs.\n2. On success, save the public key ID and place\
    \ the credential value in secure storage. After a lost response or restart, reload\
    \ the journal. If the public ID was already saved, reconcile by that ID; otherwise\
    \ list keys and match the exact attempt name.\n3. Handle the number of name matches\
    \ explicitly:\n   - **Zero:** retain the attempt as unresolved if the original\
    \ POST may still be executing. It can commit after the list response. A finite\
    \ number of empty lists does not prove cleanup or make retrying create safe.\n\
    \   - **One:** only with the unique-name/single-POST preconditions above, save\
    \ the returned public ID and revoke that key. Metadata cannot recover its secret.\n\
    \   - **More than one:** stop automatic recovery. Do not choose the newest key\
    \ or revoke all matches on the basis of the name. Timestamps and scopes do not\
    \ establish which request created a key.\n4. Revoke by the saved public ID. A\
    \ `204`, or a repeated `404` for that correctly identified ID in the same account/environment,\
    \ followed by its absence from the list establishes API-level cleanup of that\
    \ key. It does not cancel other pending creates. Revocation rejects subsequent\
    \ authentication with that key; it does not undo requests already authorized with\
    \ it. Revoking the issuing credential does not cascade to keys it issued.\n5.\
    \ After resolving the original attempt and confirming the identified key's removal,\
    \ issue a replacement under a new attempt name with the required working scopes.\
    \ Store and check the new credential securely. If the attempt remains pending\
    \ or ambiguous, keep its journal entry unresolved and continue reconciliation\
    \ or seek operator assistance; do not report successful cleanup just because a\
    \ polling timeout elapsed.\n\nThis procedure reconciles a completed issuance without\
    \ recovering its secret. It does not provide a server-side cancel operation or\
    \ a bounded-time resolution guarantee for an in-flight create.\n"

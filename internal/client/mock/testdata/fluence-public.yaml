            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '409':
          description: Resource state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '413':
          description: JSON request body exceeds the configured limit; code is bad_request
            and the violation is field `$`, reason `payload_too_large`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '422':
          description: Semantically incompatible request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                format: u-int64
                minimum: 0
              description: Seconds until the request may be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '503':
          description: Dependency or operation outcome unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
      security:
      - api_key:
        - vpc:write
      - access_jwt_token:
        - vpc:write
  /v3/vpcs/{vpc_id}/subnets:
    post:
      tags:
      - Subnets
      summary: Create subnet
      operationId: public_v3_create_subnet
      parameters:
      - name: vpc_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UserVpcId'
      - name: Idempotency-Key
        in: header
        description: Unsupported for subnet creation; requests carrying this header
          are rejected with 400.
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubnetRequest'
            example:
              egress: true
              ipv4Cidr: 10.1.0.0/24
              name: private
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSubnetDto'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '404':
          description: The selected VPC does not exist, is not owned by the caller,
            or is being removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
              example:
                code: not_found
                error: resource not found
        '409':
          description: The selected VPC is being parked (`conflict`); retry shortly.
            The requested CIDR overlaps the reserved default range (`reserved_default_subnet_cidr_conflict`);
            change the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
              example:
                code: reserved_default_subnet_cidr_conflict
                error: subnet CIDR overlaps the reserved range
        '413':
          description: JSON request body exceeds the configured limit; code is bad_request
            and the violation is field `$`, reason `payload_too_large`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '422':
          description: The selected VPC has failed (`parent_vpc_failed`), no CIDR
            was provided (`subnet_cidr_required`), or egress was requested for an
            IPv6-only subnet (`ipv6_egress_unsupported`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
              example:
                code: subnet_cidr_required
                error: a subnet CIDR is required
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                format: u-int64
                minimum: 0
              description: Seconds until the request may be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
        '503':
          description: Dependency or operation outcome unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicV3ErrorBody'
      security:
      - access_jwt_token:

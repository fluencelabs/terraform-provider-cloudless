  /v1/public_ips:
    get:
      tags:
      - PublicIP
      operationId: get_users_public_ips
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserPublicIpId'
      - name: clusterId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ClusterId'
      - name: datacenterId
        in: query
        description: 'Filter to public IPs in every cluster of this datacenter. Combine
          with

          `clusterId` to narrow to a single cluster; both must match.'
        required: false
        schema:
          $ref: '#/components/schemas/DatacenterId'
      - name: cityCode
        in: query
        description: 'Filter to public IPs in every datacenter of this city (a city
          may span

          several datacenters). Combine with other filters; all must match.'
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Case-insensitive ILIKE match on name; '%' and '_' in the value
          act as SQL wildcards (any-sequence / any-single-char), not literal characters.
        required: false
        schema:
          type: string
        example: my-vm
      - name: status
        in: query
        description: 'Keep only public IPs whose status is in this set. Repeat the
          parameter

          using bracket notation (`status[0]=ready&status[1]=new`); a single

          `status=ready` is also accepted. An empty set applies no filtering.'
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserPublicIpStatusDto'
      - name: excludeStatus
        in: query
        description: 'Drop public IPs whose status is in this set

          (`excludeStatus[0]=removed`). Combined with `status`, the result is the

          intersection. An empty set applies no filtering.'
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserPublicIpStatusDto'
      - name: addressType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IpAddressType'
      - name: excludeAttached
        in: query
        description: 'When `true`, exclude public IPs attached to any VM, returning
          only

          unattached ones. Absent or `false` applies no filtering.'
        required: false
        schema:
          type: boolean
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortFieldDto'
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderDto'
      - name: page
        in: query
        description: 'One-based page number. Both this value and the computed

          `(page - 1) * perPage` offset must be no greater than

          9,007,199,254,740,991.'
        required: false
        schema:
          type: integer
          format: u-int64
          maximum: 9007199254740991
          minimum: 0
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: u-int64
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserPublicIpDto'

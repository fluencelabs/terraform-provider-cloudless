  /v1/configurations/virtual_machines:
    get:
      tags:
      - Hardware
      summary: 'Raw, unfiltered catalog of *all* VM configurations (every row in

        `crd.vm_configurations`, including unpriced SKUs such as `cpu-shared-*`

        before Phase 2 pricing lands). This is intentionally **not** a

        "what can I buy here" listing: it has no price-gate, no per-cluster

        `cpu_allocation_ratio`, and no cluster scope. It backs admin/internal

        tooling that needs the full catalog (e.g. assigning prices to a SKU that

        has none yet) and id->detail lookups for already-created VMs.'
      description: 'The customer-facing, buyable listing — price-gated and ratio-gated
        per

        cluster — is `GET /v1/clusters/{cluster_id}/resources`

        (`api::hardware::resources::get_available_resources`). Do not treat this

        endpoint as a plan picker; selecting an unpriced SKU here would 404 on

        `POST /v2/vms`.'
      operationId: get_vm_configurations
      responses:
        '200':
          description: List of available vm configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse_VmConfigurationDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: default_topology_unusable
                error: 'the default network is not usable: the default VPC is unhealthy;
                  delete the default VPC and retry'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
